spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/restaurant_saas_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: RestaurantSaasProdHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Schema is owned exclusively by Flyway migrations in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.restaurantsaas.platform: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

# Production hardening
app:
  seed-demo-data: false # Demo data must NEVER be seeded in production
  jwt:
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000} # 15 minute access tokens in prod
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:86400000} # 24 hours

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false # Disable OpenAPI/Swagger in production
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never # Do not leak dependency details to unauthenticated callers
      status:
        http-mapping:
          down: 503
  info:
    env:
      enabled: false
