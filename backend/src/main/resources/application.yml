spring:
  application:
    name: restaurant-saas-platform
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

# Application Specific Properties
app:
  seed-demo-data: false # Demo data seeding is opt-in only (dev profile or APP_SEED_DEMO_DATA=true)
  jwt:
    # MUST be provided via APP_JWT_SECRET env var (min 256 bits). No default on purpose:
    # the application fails fast at startup if the secret is missing or too short.
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000} # 1 hour access tokens
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: restaurant-saas-platform
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - "X-Tenant-ID"
      - "X-Branch-ID"
      - "Authorization"
    allow-credentials: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Kubernetes/LB probes use liveness/readiness groups (no dependency details)
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
